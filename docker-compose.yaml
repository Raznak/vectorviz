version: "3.2"
services:
  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile.dev
    ports:
      - 9000:9000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile.dev
    environment:
      DEV_MODE: yes
      VECTOR_CONFIG_MAP_PATH: "/vector/map.yaml"
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - ./vector:/vector

  vector:
    image: timberio/vector:0.37.0-debian
    volumes:
      - ./vector:/etc/vector
    command: ["--config", "/etc/vector/config.yaml"]
    ports:
      - 8686:8686
